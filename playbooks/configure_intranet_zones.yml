---
- name: Configure Windows Client Intranet Security Zones
  hosts: windows_workstations
  gather_facts: false
  vars:
    trusted_file_server_ip: "192.168.1.252"

  tasks:
    - name: Ensure trusted file server is added to Local Intranet Zone (Zone 1)
      ansible.windows.win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\Domains\{{ trusted_file_server_ip }}
        name: file
        data: 1
        type: dword
        state: present
